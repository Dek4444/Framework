services:
  #konfigurasi untuk container database
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgre
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DATABASE: database_name
      ports:
        #format portDikomputer:postcontainer
        - "5432:5432"
      volumes:
        #menyimpan database ke hdd
        - postgre_data_volume:/var/lib/postgresql/data
volumes:
  postgre_data_volume